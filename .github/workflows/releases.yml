name: Release

on:
    workflow_dispatch:
    push:
      branches:
        - master
       
permissions:
    contents: write

jobs:
    build:
        name: Release theme
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v3

            - name: Setup node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "lts/*"

            - name: Install dependencies
              run: npm ci
              
            - name: Build
              run: npm run build

            - name: Upload xynity-blocks.zip to release
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.TOKEN }}
                  file: ./storefront-child.zip
                  asset_name: storefront-child.zip
                  tag: ${{ github.ref }}
                  overwrite: true