name: Release

on:
    workflow_dispatch:
    push:
      branches:
        - master
       
permissions:
    contents: write

jobs:
    build:
        name: Release theme
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v3

            - name: Setup node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "lts/*"

            - name: Install dependencies
              run: npm ci
              
            - name: Build
              run: npm run build

            - name: Read package version
              id: version
              run: |
                  echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

            - name: Upload file
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ github.token }}
                  file: ./storefront-child.zip
                  asset_name: storefront-child-${{ steps.version.outputs.version }}.zip
                  tag: v${{ steps.version.outputs.version }}
                  release_name: "storefront-child v${{ steps.version.outputs.version }}"
                  overwrite: true